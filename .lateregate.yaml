# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

cover:
  trim_prefix: github.com/latere-ai/origo/
  exempt: {}

spec:
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  started: [dispatched, in-progress, testing, complete]
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

hermetic:
  # The suite runs with only the Go toolchain on PATH, plus /usr/bin: git is
  # the one binary origod needs beside itself (spec 002), and the repository
  # cache and the smart HTTP handlers are tested against the real git.
  # /usr/bin holds git on macOS and on the Linux runners.
  allow: [/usr/bin]

tempdir:
  allow: {}

otel_client:
  skip: [tools, test]

modernize:
  disable: []

# Spec 001's last criterion, owned by spec 013: the build list of
# ./cmd/origod reaches no cloud SDK and no Kubernetes client. The allow
# list is latere.ai/x/pkg and the standard library, so a new dependency
# is a decision recorded here.
depcheck:
  packages:
    github.com/latere-ai/origo/cmd/origod:
      decision: >-
        the node reaches latere.ai/x/pkg and the standard library and
        nothing else, so the binary carries no cloud SDK and no
        Kubernetes client (spec 001)
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
        github.com/google/uuid: reached through latere.ai/x/pkg, which names events and deliveries with it; not a cloud SDK

license:
  spdx: MIT
  holder: Latere AI
