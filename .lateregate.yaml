# The shared quality bar, read by `go tool lateregate`. The gates live in
# latere.ai/x/ci-gate, pinned in go.mod; only repository-specific values are
# here.

# The files that name the release. `lateregate release` rewrites each pattern's
# version to the tag it cuts, in the same commit as the changelog, so these
# never lag the tag and main does not go red after a cut. The claims tests in
# tools/docs enforce that they match the changelog's newest section.
release:
  stamp:
    - file: SECURITY.md
      pattern: 'v\d+\.\d+\.\d+ is the\s+current release'
    - file: deploy/prod/kustomization.yaml
      pattern: 'newTag: v\d+\.\d+\.\d+'
    - file: docs/install.md
      pattern: 'VERSION=v\d+\.\d+\.\d+ +# the release you picked'

cover:
  trim_prefix: latere.ai/x/origo/
  exempt:
    cmd/origo: >-
      main and nothing else: it reads the environment, opens a signal
      context, and passes both to origocli.Run, which returns the exit
      code. Spec 025 draws that boundary on purpose, so the package holds
      no behavior a test could call. The exit codes a shell reads are
      proved by TestTheBinaryCarriesTheExitCodesThroughTheProcess, which
      runs the built binary as a subprocess and therefore attributes no
      coverage to it, and every decision behind them is covered in
      internal/origocli
    test/stubs/origo: >-
      the contract stub other repositories test against, which is test
      code itself: the suite in test/conformance runs against it
      (TestStubConforms), so what it stubs is proved there. Its uncovered
      lines are t.Fatal after constructors that cannot fail with the
      stub's own inputs, which no test can reach.

spec:
  status:
    - vague
    - drafted
    - validated
    - dispatched
    - in-progress
    - testing
    - complete
    - stale
    - superseded
  require: [title, status, track, depends_on, affects, effort, created, updated, author]
  wikilinks: true
  numbered: true
  # No started list: status records a spec's own criteria; review holds the depends_on order.
  settled: [complete, superseded]
  require_section:
    - Overview
    - Design
    - Acceptance criteria
  require_section_by_status:
    complete: [Outcome]

hermetic:
  # The suite runs with only the Go toolchain on PATH, plus /usr/bin and
  # /bin: git is the one binary origod needs beside itself (spec 002), and
  # the repository cache and the smart HTTP handlers are tested against the
  # real git. /usr/bin holds git on macOS and on the Linux runners. /bin
  # holds sh's coreutils (cat, rm, mkdir) that the two shell tests under
  # tools/ run; on Linux it is the same directory as /usr/bin, on macOS it
  # is not.
  allow: [/usr/bin, /bin]

tempdir:
  allow: {}

otel_client:
  skip: [tools, test]

modernize:
  disable: []

# Spec 001's last criterion, owned by spec 013: the build list of
# ./cmd/origod reaches no cloud SDK and no Kubernetes client. The allow
# list is latere.ai/x/pkg, the OpenTelemetry SDK it exports telemetry
# through, and the standard library, so a new dependency is a decision
# recorded here.
depcheck:
  packages:
    latere.ai/x/origo/cmd/origod:
      decision: >-
        the node reaches latere.ai/x/pkg, the OpenTelemetry SDK that
        pkg/otel exports through (spec 011),
        golang.org/x/crypto/ssh, which internal/sshd terminates the SSH
        transport with (spec 024), and the standard library, so the
        binary carries no cloud SDK and no Kubernetes client (spec 001)
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002)
        github.com/google/uuid: imported directly to name events, deliveries, and the probe object of `origod check`, and reached through latere.ai/x/pkg besides; not a cloud SDK
        go.opentelemetry.io: the OpenTelemetry SDK, exporters, and instrumentation the traces, metrics, and log bridge of spec 011 go out through
        google.golang.org: protobuf and gRPC, the wire format and the transport of the OTLP exporters
        golang.org/x/crypto: the SSH transport of internal/sshd (spec 024), the fourth direct dependency of the module, confined to that package and reaching golang.org/x/sys and nothing else
        golang.org/x/net: reached by the OTLP exporters
        golang.org/x/sys: reached by the OTLP exporters and by golang.org/x/crypto
        golang.org/x/text: reached by the OTLP exporters
        golang.org/x/time: reached by the OTLP exporters
        github.com/cenkalti/backoff: the OTLP exporters' retry schedule
        github.com/cespare/xxhash: the metric SDK's aggregation keys
        github.com/felixge/httpsnoop: otelhttp's response recorder
        github.com/go-logr: the OpenTelemetry SDK's internal logging interface
        github.com/grpc-ecosystem/grpc-gateway: the OTLP status marshalling the exporters read errors with
    latere.ai/x/origo/cmd/origo:
      decision: >-
        the agent client of spec 025 reaches the standard library,
        internal/contract and the authorizer vocabulary that package
        reads its action names from, and through those two
        latere.ai/x/pkg with github.com/google/uuid behind it, so it
        carries no OpenTelemetry package, no golang.org/x/crypto, no
        cloud SDK and no Kubernetes client. It imports internal/contract
        so the error codes it branches on are the ones the node writes
        and cannot drift, and that package reads the four action strings
        from ./authorizer for the same reason (spec 028). Spec 001's
        seventh invariant needs no amendment: its module half is
        unchanged and its gate half names ./cmd/origod, which this row
        joins rather than widens
      allow:
        latere.ai/x/pkg: the shared library every Latere service is built on (spec 002), reached through internal/contract's error envelope and through the authorizer vocabulary's authz.Vocabulary
        github.com/google/uuid: reached behind latere.ai/x/pkg; not a cloud SDK

# The Go modules beside the root. tools/specindex parses the specs and holds
# the test that the cross-reference table in specs/README.md equals what the
# specs define; tools/apidoc renders docs/internals/contract.md and
# api/openapi.yaml from the same specs and holds the tests that the committed
# files equal what it writes. Neither is in the root's ./..., so without this
# list nothing would run their tests. The root's own generator test, in
# tools/configdoc, checks docs/configuration.md the same way.
modules:
  - tools/specindex
  - tools/apidoc

# The suites that need a real service or a cluster, run by `lateregate e2e`.
e2e:
  # The write-ahead log against a real bucket: every test tagged integration
  # in internal/wal. lateregate starts MinIO, creates the bucket and hands the
  # tests the family of variables they read; the path-style flag is the fixed
  # value MinIO needs when it is addressed by IP.
  - name: wal-integration
    why: the write-ahead log keeps its guarantees against a real S3 bucket, with the race detector on
    test: {tags: [integration], packages: [./internal/wal/...], race: true}
    services: [minio]
    buckets: [origo-test]
    env:
      ORIGO_TEST_S3_ENDPOINT: "${minio.endpoint}"
      ORIGO_TEST_S3_REGION: "${minio.region}"
      ORIGO_TEST_S3_BUCKET: origo-test
      ORIGO_TEST_S3_KEY: "${minio.access_key}"
      ORIGO_TEST_S3_SECRET: "${minio.secret_key}"
      ORIGO_TEST_S3_PATH_STYLE: "1"
  # The one-node tier of spec 013: every e2e test named TestE2E starts nodes
  # of its own beside the bucket, with no cluster. The cluster tiers stay in
  # tiers.yml, because they cost about half the minutes of a run and the
  # release is where they decide anything.
  - name: one-node-e2e
    why: nodes started beside a real bucket serve pushes, fetches and recovery end to end, with the race detector on
    test: {tags: [e2e], packages: [./test/e2e/...], run: TestE2E, race: true}
    services: [minio]
    buckets: [origo-test]
    env:
      ORIGO_TEST_S3_ENDPOINT: "${minio.endpoint}"
      ORIGO_TEST_S3_REGION: "${minio.region}"
      ORIGO_TEST_S3_BUCKET: origo-test
      ORIGO_TEST_S3_KEY: "${minio.access_key}"
      ORIGO_TEST_S3_SECRET: "${minio.secret_key}"
      ORIGO_TEST_S3_PATH_STYLE: "1"
    timeout: 20m
  # Spec 018's install job: docs/install.md is walked against a bare kind
  # cluster with Cilium, from images built out of this tree, and the
  # conformance contract is run against the installation it produces. The
  # script builds the two candidate images itself, so the suite reads what
  # they are built from (the Dockerfiles and the module files; a Go change
  # runs it anyway), what it installs (deploy, which holds the kind overlay
  # and the Cilium pin, and the embedded api/ document) and what it walks
  # (the document and the scripts).
  - name: install
    why: docs/install.md, walked block by block against a bare cluster with the candidate images, brings up an installation that passes the conformance contract
    command: tools/docs/install-walk.sh
    tools: [kind, helm, kubectl]
    reads:
      - docs/install.md
      - deploy
      - api
      - authorizer
      - Dockerfile
      - Dockerfile.stubs
      - go.mod
      - go.sum
      - tools/docs
      - test/conformance
      - test/stubs
    # The subtests that skip are the cases that need a stub the
    # installation does not carry (an issuer, a controllable authorizer, a
    # fault injector, a quota to exceed, a source to hold): the contract
    # suite skips each by name when its target is a live installation, and
    # the cluster tiers in tiers.yml run them against the stack with the
    # stubs wired.
    allow_skip: the contract suite skips by name the subtests that need stub wiring an installation from docs/install.md does not have
    timeout: 40m

license:
  spdx: MIT
  holder: Latere AI

# The identity shape every core of the family shares.
identity:
  role: core
  audience: origo
  config_prefix: ORIGO
  api_group: origo.latere.ai
  # deploy/prod is the hosted installation's overlay in the core's tree.
  skip:
    - deploy/prod
  # The same overlay, declared: the no-latere-value rule reads the
  # addresses deploy/prod sets, so a document may name the installation
  # it serves.
  overlays:
    - deploy/prod
  # Access is by role: the roles rule runs, and it is one way once set.
  roles_only: true
