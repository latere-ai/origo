# Origo's HTTP surface as an OpenAPI 3.1 document, generated from the
# endpoint, header and code tables of the design specs by `make docs`.
# Do not edit: a test fails when this file is not what a fresh run
# produces, and the specs are where a route's behavior is stated.
#
# It names no server, because a document in a repository describes no one
# installation, and no release, because what a client pins is the contract
# version in info.version. A consumer vendoring this file records the tag
# it took it from.
openapi: 3.1.0
info:
  title: Origo
  version: "1"
  description: "Git hosting as an infrastructure component: repositories addressed by a caller-chosen id, git over HTTP and SSH, and a JSON API for the repository lifecycle, reads, LFS, administration and server-side git operations. Every operation below is one row of a design spec; see the tags for where a route lives."
tags:
- name: administration
  description: Rename, transfer, freeze, import, export, statistics and garbage collection.
- name: operations
  description: Commits, merges, cherry-picks and reverts made by the node, without a clone.
- name: read
  description: References, commits, diffs, trees, blobs and archives, served by git from the node's copy.
- name: repositories
  description: The repository lifecycle and the directory a caller is allowed to see.
- name: service
  description: What an installation answers about itself. Not part of a caller's integration.
- name: tokens
  description: Repository-bound tokens and the key set they are verified against.
- name: transport
  description: git over HTTP and the LFS transfer API, at the host the clone URLs name.
paths:
  /:
    get:
      operationId: getRoot
      summary: Get landing page
      description: "200, the landing page; `text/html; charset=utf-8` when `Accept` contains `text/html`, `text/plain; charset=utf-8` otherwise, `Vary: Accept` on both; no token, no `WWW-Authenticate`"
      tags:
      - service
      x-scope: operator
      security: []
      responses:
        "200":
          description: OK
  /.well-known/jwks.json:
    get:
      operationId: getWellKnownJwksJson
      summary: Get signing keys
      description: the public key set Origo signs with, no token required; unauthenticated like `GET /readyz` and `GET /version` (spec 002), and the only unauthenticated path that is part of the contract
      tags:
      - tokens
      security: []
      responses:
        "200":
          description: OK
  /favicon.ico:
    get:
      operationId: getFaviconIco
      summary: Get favicon
      description: 204, empty, no token; so a browser rendering the page is never asked for credentials it cannot supply
      tags:
      - service
      x-scope: operator
      security: []
      responses:
        "204":
          description: No Content
  /livez:
    get:
      operationId: getLivez
      summary: Check liveness
      description: 200 `ok`, touches no dependency
      tags:
      - service
      x-scope: operator
      security: []
      responses:
        "200":
          description: OK
  /metrics:
    get:
      operationId: getMetrics
      summary: Get metrics
      description: the `latere.ai/x/pkg/metrics` registry in the Prometheus text format
      tags:
      - service
      x-scope: operator
      security: []
      responses:
        "200":
          description: OK
  /openapi.yaml:
    get:
      operationId: getOpenapiYaml
      summary: Get OpenAPI document
      description: 200, this document, `application/yaml`; the bytes of `api/openapi.yaml` as the build embedded them. No token, like `GET /readyz` and `GET /version` (spec 002); unlike those two it is part of the contract, so a client may read it at any installation
      tags:
      - service
      security: []
      responses:
        "200":
          description: OK
  /readyz:
    get:
      operationId: getReadyz
      summary: Check readiness
      description: "200 `ok` when every check passes; 503 `not ready: <check>: <error>` otherwise, and `not ready: draining` during shutdown; text, the developer register. The `storage` check passes while a storage breaker is open, once the bucket has answered this replica at least once since it started, because such a node still serves warm repositories stale and refuses writes with a code, and taking it out of rotation would lose those reads (spec 015)"
      tags:
      - service
      x-scope: operator
      security: []
      responses:
        "200":
          description: OK
  /v1/repos:
    get:
      operationId: getV1Repos
      summary: List repositories
      description: "two modes, chosen by the query. **Directory:** `?cursor=&limit=` asks the authorizer the `list` question and answers `{\"repos\": [<the representation of GET /v1/repos/{id}>], \"next_cursor\": <the authorizer's, or null>}`, dropping every id the log no longer holds; `limit` default 50, at most 200, and a value outside it is 400 `invalid_request` with `details.reason: \"limit\"`; 403 `forbidden` when the authorizer denied; 501 `directory_unsupported` when it answered `{\"directory\": false}`. **Name:** `?owner=&slug=` resolves the name through `origo/names/<owner>/<slug>`, the index the git label form already reads, then answers exactly as `GET /v1/repos/{id}` does for the id it resolved to: the authorizer is asked `read` on that id first and a deny is 403 whether or not the name resolved, so a refused caller learns nothing (spec 007, authorization before lookup); an allowed caller gets 404 `repo_not_found` when it did not resolve. One of `owner` and `slug` without the other is 400 `invalid_request` naming the missing field, and either together with `cursor` or `limit` is 400 `invalid_request` with `details.reason: \"modes\"`"
      tags:
      - repositories
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: string
      - name: owner
        in: query
        required: false
        schema:
          type: string
      - name: slug
        in: query
        required: false
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/invalid_request"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/repo_not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
        "501":
          $ref: "#/components/responses/directory_unsupported"
    post:
      operationId: postV1Repos
      summary: Create repository
      description: "**Request:** `{\"id\", \"owner\", \"slug\", \"default_branch\"}`; `default_branch` defaults to `main` and must be a valid branch name\n\n**Response:** 201 with the representation; 409 `repo_exists` on a duplicate id or a taken `owner/slug`; 400 `invalid_request`"
      tags:
      - repositories
      security:
      - bearer: []
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/invalid_request"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          $ref: "#/components/responses/repo_exists"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}:
    delete:
      operationId: deleteV1ReposById
      summary: Delete repository
      description: "**Response:** 202 `{\"id\", \"deleted_at\", \"purge_after\"}`; every other endpoint answers 404 from then on and 410 `gone` once the objects are purged after the 7 day hold (spec 019); repeated on a deleted repository, 202 with the original times"
      tags:
      - repositories
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "202":
          description: Accepted
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "410":
          $ref: "#/components/responses/gone"
        "429":
          $ref: "#/components/responses/rate_limited"
    get:
      operationId: getV1ReposById
      summary: Get repository
      description: "**Response:** 200 `{\"id\", \"owner\", \"slug\", \"default_branch\", \"size_bytes\", \"head\", \"updated_at\"}`; 404 `repo_not_found` for an unknown, malformed, or deleted id; 410 `gone` for a purged id (spec 019). Other specs add fields to the representation and own them: `pushed_at` (spec 009), `frozen_at` (spec 019), `verified_at` and `verified_equal` (spec 014); each is null until its operation ran"
      tags:
      - repositories
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/repo_not_found"
        "410":
          $ref: "#/components/responses/gone"
        "429":
          $ref: "#/components/responses/rate_limited"
    patch:
      operationId: patchV1ReposById
      summary: Update repository
      description: "**Request:** any subset of `{\"owner\", \"slug\", \"default_branch\"}`\n\n**Response:** 200 with the representation; a rename takes effect at once and the old URL answers 404; `default_branch` moves `HEAD` through the log; 409 `repo_exists` when the name is taken"
      tags:
      - repositories
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          $ref: "#/components/responses/repo_exists"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/archive/{sha}.tar.gz:
    get:
      operationId: getV1ReposByIdArchiveByShaTarGz
      summary: Download archive
      description: "`git archive --format=tar.gz --prefix=<slug>-<7 hex>/ <sha>` streamed; entries in git's tree order, mtime the commit time, no `.git`; reproducible for one git version"
      tags:
      - read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: sha
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/blob/{sha}:
    get:
      operationId: getV1ReposByIdBlobBySha
      summary: Get blob
      description: raw bytes of a blob with `Content-Type` from `http.DetectContentType` over the first 512 bytes and `Content-Length`; `Range` honored; a blob over 50 MiB without a `Range` of at most 50 MiB is 413 `blob_too_large`
      tags:
      - read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: sha
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "413":
          $ref: "#/components/responses/blob_too_large"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/cherry-pick:
    post:
      operationId: postV1ReposByIdCherryPick
      summary: Cherry-pick commits
      description: "**Body beyond the common fields:** `commits: [<sha>]`, 1 to 100, applied in order, `mainline` for a merge commit\n\n**Result:** 201, one commit per picked commit, all in one entry and one transaction, so partial application never lands; a conflict is 409 `merge_conflict` naming the commit and paths; 200 for a `dry_run`"
      tags:
      - operations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          $ref: "#/components/responses/merge_conflict"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/commits:
    get:
      operationId: getV1ReposByIdCommits
      summary: List commits
      description: "`?ref=<sha or name>` (default `HEAD`) `&path=&since=&until=&limit=&cursor=`; newest first in `git rev-list` order; `limit` default 50, at most 200; `since` and `until` RFC 3339; `cursor` is the sha of the last commit of the previous page: the node walks `git rev-list --end-of-options <ref>` from the start, discards output up to and including the cursor, and returns the next `limit` commits, so a page is exact whatever the graph and `--skip` is never used; a cursor not in the walk is 400 `invalid_request` with `details.reason: \"cursor\"`; `{\"commits\": [{\"sha\", \"parents\", \"author\": {\"name\", \"email\", \"at\"}, \"committer\": {…}, \"message\", \"trailers\": [{\"key\", \"value\"}]}], \"next_cursor\"}`, `trailers` from `%(trailers:only,unfold)` in the format of the same `rev-list`, git's own trailer parser as `interpret-trailers --parse` runs it, so a page is one subprocess and not one per commit, in the order they appear with duplicate keys kept, empty when there are none; a repository whose `ref` does not exist because it has no commit yet (the default `HEAD` of an empty repository) answers 200 with `commits: []` and `next_cursor: null`, while a named `ref` that does not exist in a repository with history is 404 `ref_not_found`"
      tags:
      - read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: ref
        in: query
        required: false
        schema:
          type: string
      - name: path
        in: query
        required: false
        schema:
          type: string
      - name: since
        in: query
        required: false
        schema:
          type: string
      - name: until
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/invalid_request"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/ref_not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
    post:
      operationId: postV1ReposByIdCommits
      summary: Create commit
      description: "**Body beyond the common fields:** `changes: [{\"path\", \"content\" (base64, at most 10 MiB decoded per file) | \"content_ref\" (a blob sha already in the repository) | \"delete\": true, \"mode\": \"100644\"|\"100755\"|\"120000\"}]`, 1 to 1 000 changes in a body of at most 64 MiB, each `path` checked by the rules below\n\n**Result:** 201, one commit with `expected_head` as parent; 200 for a `dry_run`"
      tags:
      - operations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/commits/{sha}:
    get:
      operationId: getV1ReposByIdCommitsBySha
      summary: Get commit
      description: "the commit as above plus `\"stats\": {\"files\", \"additions\", \"deletions\"}` from `git show --numstat`; binary files count as a file with 0 lines"
      tags:
      - read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: sha
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/compare/{base}...{head}:
    get:
      operationId: getV1ReposByIdCompareByBaseByHead
      summary: Compare revisions
      description: "`?path=&base=&head=`; `text/x-diff` from `git diff -M --no-color --end-of-options <base> <head> -- <path>`; at most 1 MiB, cut at a file boundary with `Origo-Truncated: true`; binary files listed as `Binary files differ`"
      tags:
      - read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: base
        in: path
        required: true
        schema:
          type: string
      - name: head
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: false
        schema:
          type: string
      - name: base
        in: query
        required: false
        schema:
          type: string
      - name: head
        in: query
        required: false
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/export.bundle:
    get:
      operationId: getV1ReposByIdExportBundle
      summary: Export repository
      description: "`git bundle create - --all` streamed as `application/x-git-bundle`: the complete repository in one portable file; action `read`; the subprocess runs under a 10 minute deadline (spec 012), and a bundle cut by the deadline is a truncated body the client refuses, never a status, because the headers are sent with the first byte: `git bundle verify` reads the header and the prerequisites, so it refuses a cut inside those, and a `git clone` from the bundle refuses a cut inside the pack; a repository with no reference is 404 `ref_not_found` (spec 003), because `git bundle create` writes no empty bundle and an empty repository is a state and not a failure of the node"
      tags:
      - administration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/ref_not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/freeze:
    post:
      operationId: postV1ReposByIdFreeze
      summary: Freeze repository
      description: "sets `frozen_at`; writes refuse with `repo_frozen` while reads continue: a push is refused at `info/refs?service=git-receive-pack`, before the client uploads a pack, with the same shape spec 015 uses for an open write breaker (HTTP 200, the advertisement content type, and one `ERR repo_frozen: <the sentence below>` pkt-line, so git prints it as `remote error`), and again by the hook's verdict `reject repo_frozen: <sentence>` as defense for a client that sends `git-receive-pack` without the advertisement; the JSON API's write operations of spec 020 answer 403 `repo_frozen`; `GET /v1/repos/{id}` reports `frozen_at`; a second freeze is 409 `repo_frozen`; emits `frozen`"
      tags:
      - administration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: service
        in: query
        required: false
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          description: "forbidden: You do not have permission to do this. repo_frozen: This repository is frozen and does not accept pushes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/repo_frozen"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/gc:
    post:
      operationId: postV1ReposByIdGc
      summary: Compact repository
      description: "on the repository's compaction primary (spec 005), starts compaction now (spec 006) and waits for it at most 10 seconds: 200 `{\"before\": {\"packs\", \"entries\", \"size_bytes\"}, \"after\": {…}}` when it finished, else 202 `{\"status\": \"running\", \"details\": {\"running\": true, \"started_at\": \"<RFC 3339>\"}}`, the same answer when a compaction was already running, and the caller polls `stats`; never longer than 10 seconds, because an ingress cuts a longer response (spec 006); on any other node, forwards nothing and compacts nothing: it creates the request object of spec 006 and answers 202 `{\"status\": \"scheduled\", \"details\": {\"primary\": \"<node name>\", \"within_seconds\": 600}}`, and the primary's sweep compacts within 10 minutes; 429 `rate_limited` with `Retry-After` and `details.limit: \"repository\"`, `details.retry_after` when a compaction ran on the repository within the last hour, a threshold compaction counting the same as a `gc`, counted on `origo_rate_limited_total{limit=\"repository\"}`; emits `compacted` from the node that compacted; `after.packs` is the geometric result on the node that compacted (spec 006, step 2), which folds the packs that node's copy holds and leaves a lone one alone, so the figure is one or more and never a fixed count"
      tags:
      - administration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "202":
          description: Accepted
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/import:
    get:
      operationId: getV1ReposByIdImport
      summary: Get import status
      description: "`{\"state\": \"running\"|\"done\"|\"failed\", \"refs\", \"bytes\", \"started_at\", \"finished_at\", \"error\"}` from `meta`: `running` while `importing_since` is set, `failed` when `import_error` is set, `done` when `imported_at` is set, and 404 `import_not_found` when none of them is; `refs` and `bytes` are `meta`'s `import_refs` and `import_bytes`, written with `imported_at`: the length of the import entry's reference transaction and the bytes of the uploaded `.pack` files, the entry's `PacksBytes`, because the entry itself carries no pack and its `pack_bytes` is 0; the endpoint serves what `meta` holds, so `started_at` is null once an import has finished and `finished_at` is null for one that failed; action `read`"
      tags:
      - administration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/import_not_found"
        "429":
          $ref: "#/components/responses/rate_limited"
    post:
      operationId: postV1ReposByIdImport
      summary: Import repository
      description: "`{\"source\": \"<https URL>\", \"token\": \"<optional bearer for the source>\"}`; 202 at once, the import running in the background on the receiving node under a 30 minute budget and the repository size rule of spec 012 (`quota_bytes` over packs and LFS bytes) as the cap; the procedure is below; only `https` sources on the egress allow-list of spec 016 (`ORIGO_EGRESS_ALLOW`, else 400 `invalid_request` with `details.reason: \"egress\"`), fetched with `transfer.fsckObjects` on and no credential helper; pushes answer 409 `repo_importing` while `importing_since` is set; 409 `repo_not_empty` when the newest index names any entry; a second `POST` while one runs is 409 `repo_importing`; emits `imported` when done"
      tags:
      - administration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "202":
          description: Accepted
        "400":
          $ref: "#/components/responses/invalid_request"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          description: "repo_importing: This repository is importing and does not accept pushes until the import finishes. repo_not_empty: This repository already has history; import into an empty repository."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/merge:
    post:
      operationId: postV1ReposByIdMerge
      summary: Merge revisions
      description: "**Body beyond the common fields:** `source: <branch or sha>`, `strategy: \"fast_forward_only\"|\"merge_commit\"|\"fast_forward_if_possible\"` (default), `message` optional for a merge commit, defaulting to `Merge <source> into <branch>` with both names as the request gave them\n\n**Result:** 201, fast-forward moves the branch with no new commit and answers the source's sha; a merge commit has two parents; a conflict is 409 `merge_conflict` with `details.paths`; 200 for a `dry_run`"
      tags:
      - operations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          $ref: "#/components/responses/merge_conflict"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/refs:
    get:
      operationId: getV1ReposByIdRefs
      summary: List references
      description: "`?prefix=refs/heads/` (default `refs/`), a string prefix of the full name, so `refs/tags/v1` lists `refs/tags/v1` and `refs/tags/v1.2`; `[{\"name\", \"sha\", \"peeled\"}]` from `git for-each-ref` over the directory of the prefix, the node filtering the names, because a `for-each-ref` pattern matches a whole name or a directory and `refs/tags/v1` as a pattern would list nothing; `peeled` the tag's target or null; at most 10 000 entries, `Origo-Truncated: true` past that"
      tags:
      - read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: prefix
        in: query
        required: false
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/revert:
    post:
      operationId: postV1ReposByIdRevert
      summary: Revert commits
      description: "**Body beyond the common fields:** `commits: [<sha>]`, 1 to 100, `mainline`\n\n**Result:** 201, one revert commit per input, same atomicity and conflict rule; 200 for a `dry_run`"
      tags:
      - operations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/stats:
    get:
      operationId: getV1ReposByIdStats
      summary: Get repository statistics
      description: "`{\"size_bytes\", \"lfs_bytes\", \"packs\", \"entries_since_compaction\", \"refs\", \"pushed_at\", \"compacted_at\"}` from the newest index and one listing of `lfs/`: `size_bytes` is the index object's `size_bytes` as spec 004 defines it, the bytes of the listed packs plus the pack bytes of the entries since the last compaction, which a `compact` commit sets and a push adds to, so the figure falls after a `gc`; `pushed_at` is the index object's `pushed_at` (spec 004), `compacted_at` the `at` of the newest `compact` entry the index names, null when it names none, read from that entry's head because `wal.IndexEntry` carries no time of its own; `refs` is the size of the index's reference map and counts `HEAD` with them; action `read`"
      tags:
      - administration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/tokens:
    post:
      operationId: postV1ReposByIdTokens
      summary: Create repository token
      description: "action `admin`; body `{\"scope\": \"read\"|\"write\", \"ttl\": <seconds, 1 to 3600>}`; 201 `{\"token\": \"<jwt>\", \"expires_at\": \"<RFC 3339>\"}`; 400 `invalid_request` for another scope or ttl"
      tags:
      - tokens
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/invalid_request"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/transfer:
    post:
      operationId: postV1ReposByIdTransfer
      summary: Transfer repository
      description: "`{\"owner\": \"<new>\"}`: the same operation as `PATCH` with `owner` alone, recorded as `transferred` instead of `renamed` so a consumer can act on a change of owner without inspecting a rename; the id never changes, which is what makes transfer cheap"
      tags:
      - administration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/tree/{sha}:
    get:
      operationId: getV1ReposByIdTreeBySha
      summary: List files
      description: "`?path=&recursive=0&cursor=`; `{\"entries\": [{\"path\", \"mode\", \"type\", \"sha\", \"size\"}], \"next_cursor\"}` from `git ls-tree -l`; 5 000 entries per page, `cursor` the last path"
      tags:
      - read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: sha
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: query
        required: false
        schema:
          type: string
      - name: recursive
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/undelete:
    post:
      operationId: postV1ReposByIdUndelete
      summary: Restore repository
      description: "**Response:** 200 with the representation within the hold; 410 `gone` after the purge (spec 019)"
      tags:
      - repositories
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "410":
          $ref: "#/components/responses/gone"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/unfreeze:
    post:
      operationId: postV1ReposByIdUnfreeze
      summary: Unfreeze repository
      description: clears `frozen_at`; 200 whether or not it was frozen; emits `unfrozen` when it was
      tags:
      - administration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /v1/repos/{id}/verify:
    post:
      operationId: postV1ReposByIdVerify
      summary: Verify repository
      description: "`{\"source\": \"<https URL>\", \"token\": \"<optional bearer for the source>\"}`, the same body shape as spec 019's `import`, action `admin`; compares the source and Origo's copy and answers the document below; read-only on both sides and idempotent, a `POST` only because the source bearer travels in the body, where it is never logged, and not in a header or a query string; 400 `invalid_request` for a non-HTTPS source, one the egress rules of spec 016 refuse, or one that does not answer `ls-remote`, which is the caller's input and carries `field: \"source\"` in `details`"
      tags:
      - administration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/invalid_request"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /version:
    get:
      operationId: getVersion
      summary: Get version
      description: "`{\"version\",\"commit\",\"build_time\"}` from `internal/version`, set by `-ldflags`"
      tags:
      - service
      x-scope: operator
      security: []
      responses:
        "200":
          description: OK
  /{repo}/git-receive-pack:
    post:
      operationId: postByRepoGitReceivePack
      summary: Push changes
      description: "a push; `Content-Encoding: gzip` accepted; the body is spooled to disk before git runs"
      tags:
      - transport
      parameters:
      - name: repo
        in: path
        required: true
        description: "`{repo}` is either `r/{id}.git` or `{owner}/{slug}.git`; both address the same repository, and the id form never changes."
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /{repo}/git-upload-pack:
    post:
      operationId: postByRepoGitUploadPack
      summary: Fetch repository
      description: "a fetch or clone; `Content-Encoding: gzip` accepted"
      tags:
      - transport
      parameters:
      - name: repo
        in: path
        required: true
        description: "`{repo}` is either `r/{id}.git` or `{owner}/{slug}.git`; both address the same repository, and the id form never changes."
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /{repo}/info/lfs/locks:
    post:
      operationId: postByRepoInfoLfsLocks
      summary: Request LFS lock
      description: 501 `lfs_locks_unsupported` with the LFS body below carrying its sentence; every path under `locks`, whatever the method, answers the same
      tags:
      - transport
      parameters:
      - name: repo
        in: path
        required: true
        description: "`{repo}` is either `r/{id}.git` or `{owner}/{slug}.git`; both address the same repository, and the id form never changes."
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
        "501":
          $ref: "#/components/responses/lfs_locks_unsupported"
  /{repo}/info/lfs/objects/batch:
    post:
      operationId: postByRepoInfoLfsObjectsBatch
      summary: Get LFS transfer actions
      description: "`{\"operation\": \"download\"|\"upload\", \"objects\": [{\"oid\", \"size\"}], \"transfers\": [\"basic\"]}`, body at most 1 MiB (spec 012); action `read` for download, `write` for upload; answers each object with its action, or with no `actions` for an upload of an object the store already holds (Objects, below)"
      tags:
      - transport
      parameters:
      - name: repo
        in: path
        required: true
        description: "`{repo}` is either `r/{id}.git` or `{owner}/{slug}.git`; both address the same repository, and the id form never changes."
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /{repo}/info/lfs/verify:
    post:
      operationId: postByRepoInfoLfsVerify
      summary: Verify LFS upload
      description: "the `verify` action of an upload: `{\"oid\", \"size\"}`; action `write`, because it completes the upload; 200 when the object exists with that size, 422 otherwise. The check is the size alone, from one `HEAD` of `lfs/<oid>`; the hash is not checked, because the node would have to read the whole object to compute it, and the bytes never passing through a node is the point of the presigned transfer. An object whose bytes do not match its `oid` is what the client's own `git lfs` refuses on download"
      tags:
      - transport
      parameters:
      - name: repo
        in: path
        required: true
        description: "`{repo}` is either `r/{id}.git` or `{owner}/{slug}.git`; both address the same repository, and the id form never changes."
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
  /{repo}/info/refs:
    get:
      operationId: getByRepoInfoRefs
      summary: Advertise references
      description: "`?service=git-upload-pack` or `git-receive-pack`; any other value 400 `invalid_request`; protocol v2 advertised when the client sends `Git-Protocol: version=2`, v0 otherwise"
      tags:
      - transport
      parameters:
      - name: repo
        in: path
        required: true
        description: "`{repo}` is either `r/{id}.git` or `{owner}/{slug}.git`; both address the same repository, and the id form never changes."
        schema:
          type: string
      - name: service
        in: query
        required: false
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/invalid_request"
        "401":
          $ref: "#/components/responses/unauthenticated"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/rate_limited"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A token from an issuer this installation lists, carrying an audience it verifies. Every route but the ones marked with no security takes one, the git routes included.
  schemas:
    Error:
      type: object
      description: The one refusal shape of this API. A caller branches on error.code and shows error.message.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: The stable name of the row of the error table.
            details:
              type: object
              description: The developer fields that row lists, in the developer register.
            message:
              type: string
              description: The one sentence of that row, fixed, to show a person.
          required:
          - code
          - message
      required:
      - error
  responses:
    authorizer_unavailable:
      description: "503 authorizer_unavailable: Permissions cannot be checked right now. Nothing was lost. Try again in a few minutes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    blob_too_large:
      description: "413 blob_too_large: This file is larger than 50 MiB. Request it in ranges of at most 50 MiB."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    directory_unsupported:
      description: "501 directory_unsupported: This installation does not list repositories."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    forbidden:
      description: "403 forbidden: You do not have permission to do this."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    gone:
      description: "410 gone: This repository was deleted and its hold has passed. It cannot be restored."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    import_not_found:
      description: "404 import_not_found: No import has been started for this repository."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_change:
      description: "400 invalid_change: A change in the request is not valid."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    invalid_request:
      description: "400 invalid_request: The request is malformed."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    lfs_locks_unsupported:
      description: "501 lfs_locks_unsupported: Locking is not supported."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    lfs_object_mismatch:
      description: "422 lfs_object_mismatch: The uploaded object does not match its declared size."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    lfs_object_not_stored:
      description: "404 lfs_object_not_stored: This object is not stored."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    merge_conflict:
      description: "409 merge_conflict: The change conflicts with the branch. Resolve it in a clone and push."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    non_fast_forward:
      description: "409 non_fast_forward: The reference moved since you fetched. Fetch, then push again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    operation_timeout:
      description: "504 operation_timeout: The operation took too long and nothing was changed."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    over_quota:
      description: "413 over_quota: The request exceeds this repository's storage limit."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    rate_limited:
      description: "429 rate_limited: Too many requests. Wait and try again."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ref_not_found:
      description: "404 ref_not_found: The reference or object does not exist in this repository."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    repo_exists:
      description: "409 repo_exists: A repository with this id or name already exists."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    repo_frozen:
      description: "403 or 409 repo_frozen: This repository is frozen and does not accept pushes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    repo_importing:
      description: "409 repo_importing: This repository is importing and does not accept pushes until the import finishes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    repo_not_empty:
      description: "409 repo_not_empty: This repository already has history; import into an empty repository."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    repo_not_found:
      description: "404 repo_not_found: Repository not found."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    repository_unavailable:
      description: "503 repository_unavailable: This repository cannot be served until an operator restores it. Other repositories are not affected."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    storage_unavailable:
      description: "503 storage_unavailable: The repository is temporarily unavailable. Nothing was lost. Try again in a few minutes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    unauthenticated:
      description: "401 unauthenticated: A bearer token is required."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
