# The two secrets the Deployment reads. Copy, fill in, apply by hand, and do
# not commit the filled copy. Keys are the variables spec 002 names.
apiVersion: v1
kind: Secret
metadata:
  name: origod-s3
  namespace: origo
type: Opaque
stringData:
  ORIGO_S3_ENDPOINT: https://fra1.digitaloceanspaces.com
  ORIGO_S3_REGION: fra1
  ORIGO_S3_BUCKET: example-bucket
  ORIGO_S3_KEY: replace-me
  ORIGO_S3_SECRET: replace-me
---
# Identity (spec 007): the OIDC issuers whose tokens are accepted and the
# consumer's authorization endpoint with the bearer origod sends it.
# ORIGO_GOSSIP_SECRET (spec 005) signs every gossip datagram between the
# nodes: at least 32 bytes, `openssl rand -hex 32`, the same on every
# node, required because the Deployment sets ORIGO_GOSSIP_PEERS.
#
# ORIGO_TOKEN_KEY is not here. The ECDSA P-256 key that signs
# repository-bound tokens is the one value no template can carry,
# because it must be the operator's own; it lives in the Secret
# origod-token-key, which step 4 of docs/install.md generates and the
# Deployment reads by name.
apiVersion: v1
kind: Secret
metadata:
  name: origod-auth
  namespace: origo
type: Opaque
stringData:
  ORIGO_OIDC_ISSUERS: https://auth.example.com
  ORIGO_AUTHORIZER_URL: https://platform.example.com/internal/origo/authorize
  ORIGO_AUTHORIZER_TOKEN: replace-me
  ORIGO_GOSSIP_SECRET: replace-me-with-at-least-32-random-bytes
