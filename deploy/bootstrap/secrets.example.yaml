# The two secrets the Deployment reads. Copy, fill in, apply by hand, and do
# not commit the filled copy. Keys are the variables spec 002 names.
apiVersion: v1
kind: Secret
metadata:
  name: origod-s3
  namespace: origo
type: Opaque
stringData:
  ORIGO_S3_ENDPOINT: https://fra1.digitaloceanspaces.com
  ORIGO_S3_REGION: fra1
  ORIGO_S3_BUCKET: example-bucket
  ORIGO_S3_KEY: replace-me
  ORIGO_S3_SECRET: replace-me
---
# Identity (spec 007): the OIDC issuers whose tokens are accepted, the
# consumer's authorization endpoint with the bearer origod sends it, and
# the ECDSA P-256 key that signs repository-bound tokens. Generate the key
# with `openssl ecparam -genkey -name prime256v1` and paste the whole
# output; rotating it invalidates every outstanding repository-bound token.
apiVersion: v1
kind: Secret
metadata:
  name: origod-auth
  namespace: origo
type: Opaque
stringData:
  ORIGO_OIDC_ISSUERS: https://auth.example.com
  ORIGO_AUTHORIZER_URL: https://platform.example.com/internal/origo/authorize
  ORIGO_AUTHORIZER_TOKEN: replace-me
  ORIGO_TOKEN_KEY: |
    -----BEGIN EC PARAMETERS-----
    replace-me
    -----END EC PARAMETERS-----
    -----BEGIN EC PRIVATE KEY-----
    replace-me
    -----END EC PRIVATE KEY-----
