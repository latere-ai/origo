# The route into the service, with no controller's name on it: no
# ingress class, no certificate-manager annotation, and no host, because
# each of the three is the operator's and none is the same on two
# installations. An overlay adds them (deploy/prod, and both example
# overlays under deploy/examples).
#
# Every ingress controller needs two settings beside those: no body size
# limit, because a push body is a packfile of any size, and a long read
# timeout, because a clone of a large repository takes minutes. The names
# differ per controller, so they live in the overlay too; the kind
# example carries the ingress-nginx form.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: origod
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: origod
                port:
                  name: http
