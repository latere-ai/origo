# The base holds every resource the service needs in any target. It is not
# applied directly; each target overlay names it and supplies the namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - poddisruptionbudget.yaml
  - hpa.yaml

# prometheusrule.yaml is not a resource of the base: a PrometheusRule
# needs the Prometheus operator's CustomResourceDefinition, which Origo
# does not require and the kind stack does not install, so applying the
# base to a cluster without it would fail. An installation that runs the
# operator applies it beside the base (spec 011).

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: origod
