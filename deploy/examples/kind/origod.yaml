# Node 3: the pod origod-2.
apiVersion: v1
kind: Service
metadata:
  name: origod-2
  labels:
    app.kubernetes.io/name: origod
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: origod
    statefulset.kubernetes.io/pod-name: origod-2
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30182
