# Three origod pods as the StatefulSet origod (spec 013's pods row),
# replacing the base's Deployment with the same labels so the Service,
# the PodDisruptionBudget, the NetworkPolicy, and the autoscaler apply
# unchanged, and one public and one internal Service per pod on the host
# ports of the ports table. The container spec is the base Deployment's
# with the stack's values inline: the test values are not secrets. The
# one Secret is origod-token-key, generated by up.sh.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: origod
  labels:
    app.kubernetes.io/name: origod
spec:
  serviceName: origod-gossip
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: origod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: origod
    spec:
      serviceAccountName: origod
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      # Replicas prefer to spread across nodes (spec 005): a node that
      # goes away takes one warm cache with it, not all of them.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: origod
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: origod
          image: ghcr.io/latere-ai/origod:candidate
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: 8081
              protocol: TCP
            - name: gossip
              containerPort: 7946
              protocol: UDP
          env:
            # The bucket: the MinIO row's fixed values, reached through
            # the slow proxy of spec 015, delay 0 until a test sets one
            # on its control endpoint (host port 30085).
            - name: ORIGO_S3_ENDPOINT
              value: http://slowproxy.origo.svc:8086
            - name: ORIGO_S3_PUBLIC_ENDPOINT
              value: http://localhost:30900
            - name: ORIGO_S3_REGION
              value: us-east-1
            - name: ORIGO_S3_BUCKET
              value: origo-test
            - name: ORIGO_S3_KEY
              value: minioadmin
            - name: ORIGO_S3_SECRET
              value: minioadmin
            - name: ORIGO_S3_PATH_STYLE
              value: "1"
            # One value on every pod: a repository-bound token carries it
            # as iss and verifies on any node (spec 007).
            - name: ORIGO_PUBLIC_URL
              value: http://localhost:30080
            - name: ORIGO_DATA_DIR
              value: /var/lib/origo
            - name: ORIGO_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Gossip over the headless Service with a fixed secret (spec
            # 005).
            - name: ORIGO_GOSSIP_PEERS
              value: origod-gossip
            - name: ORIGO_GOSSIP_SECRET
              value: kind-stack-gossip-secret-0123456789abcdef
            # The stubs (specs 007 and 008): the issuer over plain HTTP
            # on a cluster host, so it is listed as insecure.
            - name: ORIGO_OIDC_ISSUERS
              value: http://origo-stubs.origo.svc:8081
            - name: ORIGO_OIDC_INSECURE_ISSUERS
              value: http://origo-stubs.origo.svc:8081
            - name: ORIGO_AUTHORIZER_URL
              value: http://origo-stubs.origo.svc:8082
            - name: ORIGO_AUTHORIZER_TOKEN
              value: stub-authorizer-token
            - name: ORIGO_EVENTS_URL
              value: http://origo-stubs.origo.svc:8083
            - name: ORIGO_EVENTS_SECRET
              value: stub-sink-secret
            # Stale serving ends after 30 seconds, not 5 minutes, and a
            # storage call fails after 5 seconds, not 10, so spec 015's
            # cluster scenario fits its budget: the read breaker opens
            # inside the 30 seconds the warm copy is served stale, and
            # the deadline still clears the slow scenarios' load.
            - name: ORIGO_STALE_MAX
              value: 30s
            - name: ORIGO_STORAGE_TIMEOUT
              value: 5s
            # The per-subject rate of spec 012 is off on the stack. The
            # cluster scenarios drive one node far harder than any one
            # caller of a live installation does, hundreds of pushes and
            # clones a minute under one token, so the limit would refuse
            # the scenario rather than the abuse it is for; a production
            # node keeps the spec's 600 a minute.
            - name: ORIGO_REQUESTS_PER_MINUTE
              value: "0"
            - name: ORIGO_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: origod-token-key
                  key: ORIGO_TOKEN_KEY
          livenessProbe:
            httpGet:
              path: /livez
              port: internal
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: internal
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /livez
              port: internal
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 45
          # The stack runs on one kind node of a 4 vCPU runner: eight
          # pods (spec 005's replica counts) fit only with a small CPU
          # request, and the autoscaler's 70% target is of this value.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/origo
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir: {}
---
# Node 1 of the ports table: the pod origod-0.
apiVersion: v1
kind: Service
metadata:
  name: origod-0
  labels:
    app.kubernetes.io/name: origod
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: origod
    statefulset.kubernetes.io/pod-name: origod-0
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30180
---
apiVersion: v1
kind: Service
metadata:
  name: origod-0-internal
  labels:
    app.kubernetes.io/name: origod
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: origod
    statefulset.kubernetes.io/pod-name: origod-0
  ports:
    - name: internal
      port: 8081
      targetPort: internal
      nodePort: 30190
---
# Node 2: the pod origod-1.
apiVersion: v1
kind: Service
metadata:
  name: origod-1
  labels:
    app.kubernetes.io/name: origod
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: origod
    statefulset.kubernetes.io/pod-name: origod-1
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30181
---
apiVersion: v1
kind: Service
metadata:
  name: origod-1-internal
  labels:
    app.kubernetes.io/name: origod
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: origod
    statefulset.kubernetes.io/pod-name: origod-1
  ports:
    - name: internal
      port: 8081
      targetPort: internal
      nodePort: 30191
