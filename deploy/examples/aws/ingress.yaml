# The AWS Load Balancer Controller. The certificate is an ACM one, named
# by its ARN, so there is no cert-manager and no TLS Secret; change the
# ARN and the hostname to your own and point the hostname's DNS record at
# the load balancer the controller creates.
#
# alb.ingress.kubernetes.io/load-balancer-attributes carries the two
# settings a git remote needs from an ALB: no idle timeout short enough
# to cut a clone. An ALB has no request body limit, so there is nothing
# to raise.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: origod
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:000000000000:certificate/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
spec:
  ingressClassName: alb
  rules:
    - host: git.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: origod
                port:
                  name: http
