# Replica bounds for a small installation: two nodes always, up to eight
# under load. The autoscaler scales on CPU alone; raise maxReplicas when
# the pods sit at their CPU request under normal traffic.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: origod
spec:
  minReplicas: 2
  maxReplicas: 8
