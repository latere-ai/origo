# An installation on DigitalOcean Kubernetes with a Spaces bucket.
#
# Copy this directory, change the four names marked below, create the two
# Secrets (deploy/bootstrap/secrets.example.yaml) and the signing key
# (docs/install.md), and apply it. Nothing here is applied by CI: this
# repository has no cloud account, so the overlay is checked by
# `kustomize build` and proved by an operator's own cluster.
#
# What to change:
#   ingress.yaml     the hostname, twice
#   public-url.yaml  the same hostname
#   the Secret origod-s3: the Spaces endpoint, region, bucket, and keys
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: origo

resources:
  - ../../base

patches:
  - path: ingress.yaml
  - path: public-url.yaml
  - path: replicas.yaml
