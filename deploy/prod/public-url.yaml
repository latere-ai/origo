# The origin clients see, and the size the cache is held under. Both
# containers read both: the node serves the public URL in clone URLs and
# signs repository-bound tokens with it, and the check runs against the
# node's environment, so a check that lacked either would prove a
# configuration the node does not have.
#
# ORIGO_CACHE_BYTES is set rather than left to its default, which is 80%
# of the file system holding ORIGO_DATA_DIR. That directory is an
# emptyDir with a 20Gi sizeLimit, and the file system under it is the
# node's whole disk, so the default would let the cache grow far past the
# limit the kubelet evicts the pod at. 16Gi leaves the margin.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: origod
spec:
  template:
    spec:
      initContainers:
        - name: check
          env:
            - name: ORIGO_PUBLIC_URL
              value: https://code.latere.ai
            - name: ORIGO_CACHE_BYTES
              value: "17179869184"
      containers:
        - name: origod
          env:
            - name: ORIGO_PUBLIC_URL
              value: https://code.latere.ai
            - name: ORIGO_CACHE_BYTES
              value: "17179869184"
