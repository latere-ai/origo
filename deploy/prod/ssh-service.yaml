# The base's origod-ssh Service is a ClusterIP and reaches nothing from
# outside. DigitalOcean's cloud controller gives a LoadBalancer Service a
# load balancer of its own, which is what carries SSH: the ingress
# controller is HTTP-only and SSH is not HTTP. Point the code.latere.ai
# record at this load balancer's address alongside the ingress, and
# people clone with git@code.latere.ai:owner/slug.git.
apiVersion: v1
kind: Service
metadata:
  name: origod-ssh
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: origod-ssh
    # The proxy protocol is off: Origo reads no client address from it,
    # and a load balancer that adds a header an SSH server does not
    # expect breaks the handshake.
    service.beta.kubernetes.io/do-loadbalancer-enable-proxy-protocol: "false"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
