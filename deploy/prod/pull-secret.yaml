# Both images are private packages on ghcr.io, so the kubelet needs a
# credential to pull them. `ghcr-secret` is the one every other Latere
# service in this namespace already uses; nothing here creates it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: origod
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-secret
