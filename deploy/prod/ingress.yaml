# Latere's own values: the hostname code.latere.ai, the ingress-nginx
# class, the certificate issued by cert-manager, and the four settings a
# git remote needs from that controller. An operator's overlay is this
# file with their own names in it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: origod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - code.latere.ai
      secretName: origod-tls
  rules:
    - host: code.latere.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: origod
                port:
                  name: http
