name: Bug report
description: Something Origo does that it should not, or does not do that it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. See
        [SECURITY.md](https://github.com/latere-ai/origo/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I pushed a branch of about 400 MB and git reported ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The shortest sequence that shows it. A `git` command with its output,
        or a `curl` against the API with the request and the response, is
        ideal. Redact tokens.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or image digest, from `GET /version`.
      placeholder: v0.1.0
    validations:
      required: true

  - type: dropdown
    id: store
    attributes:
      label: Object store
      options:
        - MinIO
        - DigitalOcean Spaces
        - AWS S3
        - Other S3 compatible endpoint
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: check
    attributes:
      label: Does `origod check` pass against that bucket?
      description: >
        It proves the endpoint honours the conditional create Origo linearizes
        pushes with. A failure here explains most storage-side reports.
      options:
        - "Yes"
        - "No, and the output is in the logs below"
        - Have not run it
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant lines from the node, and the `trace_id` of the failing
        request if you have it. Redact tokens and hostnames you would rather
        not publish.
      render: text
