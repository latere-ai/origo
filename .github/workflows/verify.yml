# Every push to main and every pull request runs the gate (the shared
# pipeline of latere-ai/ci), the spec cross-reference test, the render of
# the example overlays, the integration tier of spec 013 against MinIO,
# the build of the two candidate images, and the install job of spec 018,
# which walks docs/install.md against a bare cluster from that build. The
# cluster tiers on the kind stack, the up-script check, and the mutation
# job of spec 021 run on a tag: they cost about half the minutes of a run
# and the release is the point where they decide anything, so a tag runs
# them and a push does not; workflow_dispatch runs them from main on
# demand. The install job is the one exception, because a push has no
# release to install from and the document has to stay true on the push
# that changes it; on a tag its place is taken by install-release in
# release.yml, which installs the published artifacts. The fuzz job runs
# on the Sunday schedule and on a manual dispatch and nowhere else; the
# slow cluster tier also runs on the Monday schedule, beside its tag and
# workflow_dispatch triggers, so a stale assertion in it is caught within
# a week instead of at the next tag. A job that names the schedule event
# alone takes both crons, so fuzz and build name the cron they mean and
# e2e-slow is held to the Monday one by `needs: build`.
# Each job selects its tests by name prefix and nothing else, and no job
# but build has a docker build step. Every run on the stack passes -v,
# so the log names the tests that ran and a spec's stack proof is read
# from the run rather than argued from the package's wall-clock time
# (spec 017).
name: verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Sunday 03:00 UTC: the 40 second run of every fuzz function.
    - cron: '0 3 * * 0'
    # Monday 04:00 UTC: the slow cluster tier on main.
    - cron: '0 4 * * 1'

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner is better spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

# MinIO for the jobs that run a node of their own beside a bucket and no
# stack: the fixed values of spec 013's MinIO row, on the runner's port
# 9000. A step rather than a service container because the minio image
# takes its subcommand as an argument, which the services key cannot
# pass.
env:
  MINIO_IMAGE: ghcr.io/latere-ai/minio:RELEASE.2026-09-25T12-30-31Z@sha256:025fb85cf53bad7b734dc05b012c65ce617105248ddd044d8974fb636f2a8824
  MC_IMAGE: ghcr.io/latere-ai/mc:RELEASE.2026-09-24T19-45-33Z@sha256:6e37dec77ff93cb690b9ba3f1fe2c3b34efa1cd77181fca909039819bd670a24

jobs:
  # The gate runs on the org's self-hosted runner: this repository is
  # private, so hosted minutes are metered, and origo is the largest meter
  # in the org. Removing the two inputs is the fallback to hosted runners.
  # Every job runs on GitHub's hosted runners. The repository is public,
  # so they cost nothing, and a hosted runner is a fresh machine per job:
  # the self-hosted VM held four slots, so jobs starved each other and
  # containers on fixed ports collided.
  gate:
    if: github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
    with:
      runs_on: ubuntu-latest
      test_os: '["ubuntu-latest"]'
  specindex:
    name: spec cross-reference table and alert rules
    if: github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: cd tools/specindex && go test -count=1 ./...
      # The alerts of spec 011. promtool reads a Prometheus rules file,
      # not a Kubernetes object, so specindex prints the rules document
      # inside the PrometheusRule and fails first on an alert that names
      # a metric no spec defines.
      - name: Install promtool
        env:
          PROMTOOL_TARBALL: prometheus-3.5.0.linux-amd64.tar.gz
          PROMTOOL_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLo "$PROMTOOL_TARBALL" "https://github.com/prometheus/prometheus/releases/download/v3.5.0/$PROMTOOL_TARBALL"
          echo "$PROMTOOL_SHA256  $PROMTOOL_TARBALL" | sha256sum -c -
          tar xzf "$PROMTOOL_TARBALL"
          sudo install "${PROMTOOL_TARBALL%.tar.gz}/promtool" /usr/local/bin/promtool
          promtool --version
      - name: Check the alert rules
        run: |
          mkdir -p out
          (cd tools/specindex && go run . -rules ../../deploy/base/prometheusrule.yaml) > out/rules.yaml
          promtool check rules out/rules.yaml
      # The generated reference: docs/configuration.md from
      # internal/config, docs/internals/contract.md from the specs'
      # endpoint, header, and code tables, and api/openapi.yaml from the
      # same tables (spec 030), which the node embeds and serves. A change to a variable or
      # to a spec table that was not regenerated shows up here as a
      # documentation diff on the same push.
      - name: The generated documentation is current
        run: |
          make docs
          git diff --exit-code docs/ api/
      # Spec 001's seventh invariant names the module's direct
      # dependencies; go.mod is where a reader checks the claim, so it
      # has to agree with the imports. golang.org/x/crypto sat in the
      # indirect block for two days after internal/sshd began importing
      # it, and no gate noticed.
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

  # `kustomize build` over everything under deploy/. The two cloud
  # overlays are never applied here, because this repository has no cloud
  # account; what CI can prove about them is that they render.
  overlays:
    name: the manifests render
    if: github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render every overlay
        run: |
          set -euo pipefail
          for target in base prod examples/kind examples/digitalocean examples/aws; do
            kubectl kustomize "deploy/$target" > /dev/null
            echo "deploy/$target renders"
          done

  # The integration tier and the e2e tier's one-node run, against a MinIO
  # beside the runner: every test that starts its own nodes and fits the
  # budget.
  integration:
    name: integration and one-node e2e tiers
    if: github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start MinIO with the bucket
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin "$MINIO_IMAGE" server /data
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint /bin/sh "$MC_IMAGE" -c 'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing local/origo-test'
      - name: Run the tiers
        env:
          ORIGO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          ORIGO_TEST_S3_REGION: us-east-1
          ORIGO_TEST_S3_BUCKET: origo-test
          ORIGO_TEST_S3_KEY: minioadmin
          ORIGO_TEST_S3_SECRET: minioadmin
          ORIGO_TEST_S3_PATH_STYLE: "1"
        run: make test-tiers

  # The two candidate images, built once from the push's tree and shared
  # with every job that needs them as docker save tarballs. It runs
  # everywhere but the Sunday fuzz schedule, because the install job
  # below runs on every push: the cluster tiers that bill the minutes
  # are the ones that stay on a tag, and one image build is what the
  # install job needs to walk the document from the tree it was written
  # for. It also runs on the Monday schedule, precisely, because
  # e2e-slow needs it there and a job skipped by `needs` skips its
  # dependents regardless of their own `if`.
  build:
    name: build the candidate images
    if: github.event_name != 'schedule' || github.event.schedule == '0 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build origod and origo-stubs
        run: |
          docker build -t ghcr.io/latere-ai/origod:candidate .
          docker build -f Dockerfile.stubs -t ghcr.io/latere-ai/origo-stubs:candidate .
          mkdir -p out/images
          docker save -o out/images/origod.tar ghcr.io/latere-ai/origod:candidate
          docker save -o out/images/origo-stubs.tar ghcr.io/latere-ai/origo-stubs:candidate
      # Spec 017's image criterion: the git inside the candidate image is
      # at or above the 2.40 floor origod check enforces (spec 018). This
      # is the one job with a docker build step, so the check lives here.
      - name: Check git inside the candidate image
        run: |
          set -euo pipefail
          got=$(docker run --rm --entrypoint git ghcr.io/latere-ai/origod:candidate --version | awk '{print $3}')
          echo "git $got"
          [ "$(printf '%s\n2.40\n' "$got" | sort -V | head -1)" = "2.40" ] || { echo "::error::git $got is below 2.40"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-images
          path: out/images/*.tar
          retention-days: 1
          if-no-files-found: error

  # The cluster scenarios on the three-node stack.
  e2e:
    name: cluster e2e tier
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-images
          path: out/images
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: Bring the stack up
        run: deploy/examples/kind/up.sh out/images/origod.tar out/images/origo-stubs.tar
      - name: Run the cluster scenarios
        env:
          ORIGO_TEST_S3_ENDPOINT: http://localhost:30900
          ORIGO_TEST_S3_REGION: us-east-1
          ORIGO_TEST_S3_BUCKET: origo-test
          ORIGO_TEST_S3_KEY: minioadmin
          ORIGO_TEST_S3_SECRET: minioadmin
          ORIGO_TEST_S3_PATH_STYLE: "1"
        run: go test -v -count=1 -timeout 25m -tags=e2e ./test/e2e/... -run 'TestCluster' -skip 'TestClusterUpScript'
      # The conformance suite of spec 021 against the same stack, with
      # the stubs and the Fault wired and nothing skipped, and the
      # stub-against-stack comparison that needs the stack as its second
      # target. The run drives node 1 of spec 013's ports table rather
      # than the balanced port: the rate limit is a bucket per node, and
      # at the overlay's 6000 a minute the three buckets behind the
      # balanced port refill faster than a runner sends, so the
      # rate_limited row is reachable on one node alone; a live
      # installation runs at 600, where the balanced ingress is the
      # target.
      # Spec 017's compatibility criterion beside the suite: the fixture
      # the latest release attached, when there is one, downloaded into
      # the path ORIGO_PREVIOUS_RELEASE_FIXTURE names; unset, the test
      # skips, which is the case before the first release and on a fork.
      - name: Download the latest release's fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'fixture-*.tar.gz' --dir "$RUNNER_TEMP/previous"; then
            fixture=$(ls "$RUNNER_TEMP/previous"/fixture-*.tar.gz | head -1)
            echo "ORIGO_PREVIOUS_RELEASE_FIXTURE=$fixture" >> "$GITHUB_ENV"
            echo "previous release fixture: $fixture"
          else
            echo "no release carries a fixture; TestPreviousReleaseFixture skips"
          fi
      - name: Run the conformance suite against the stack
        env:
          ORIGO_TEST_URL: http://localhost:30180
          ORIGO_TEST_S3_ENDPOINT: http://localhost:30900
          ORIGO_TEST_S3_REGION: us-east-1
          ORIGO_TEST_S3_BUCKET: origo-test
          ORIGO_TEST_S3_KEY: minioadmin
          ORIGO_TEST_S3_SECRET: minioadmin
          ORIGO_TEST_S3_PATH_STYLE: "1"
        run: go test -count=1 -timeout 25m -tags=e2e ./test/conformance/... -run 'TestContract|TestSameAnswersOnStubAndStack|TestPreviousReleaseFixture' -v

  # The slow scenarios on the same stack, with git-lfs for spec 010.
  # The longest is spec 004's materialization ceiling, which writes
  # 10 000 entries through the log before it materializes them: 7 minutes
  # of the job's 12, measured on run 34629785911. Also runs on the
  # Monday schedule (build gates this to that one, not the Sunday fuzz
  # schedule), so a stale assertion in this tier surfaces within a week
  # of a release that broke it instead of at the next tag.
  e2e-slow:
    name: slow cluster e2e tier
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-images
          path: out/images
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: Install git-lfs
        run: sudo apt-get update && sudo apt-get install -y git-lfs && git lfs version
      - name: Bring the stack up
        run: deploy/examples/kind/up.sh out/images/origod.tar out/images/origo-stubs.tar
      - name: Run the slow scenarios
        env:
          ORIGO_TEST_S3_ENDPOINT: http://localhost:30900
          ORIGO_TEST_S3_REGION: us-east-1
          ORIGO_TEST_S3_BUCKET: origo-test
          ORIGO_TEST_S3_KEY: minioadmin
          ORIGO_TEST_S3_SECRET: minioadmin
          ORIGO_TEST_S3_PATH_STYLE: "1"
        run: go test -v -count=1 -timeout 25m -tags=e2e ./test/e2e/... -run 'TestSlow'

  # up.sh on a cluster of its own, with the ports offset by 1000.
  up-script:
    name: up.sh creates and down.sh removes a stack
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-images
          path: out/images
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: Run the up-script check
        run: go test -count=1 -timeout 12m -tags=e2e ./test/e2e/... -run 'TestClusterUpScript'

  # Spec 018's install job: docs/install.md is walked against a cluster
  # an operator would have, from the candidate build of this push. It
  # runs on every push and not on a tag, because a push has no release
  # to install from and a tag has install-release in release.yml, which
  # installs the published artifacts instead. The
  # cluster is created with `kind create cluster`, not with up.sh,
  # because an operator has a cluster and no script of ours, and Cilium
  # is installed because kind.yaml turns the default CNI off and a real
  # cluster arrives with one. The overlay applied is the kind example
  # without its test-source component, which is what the document's
  # ORIGO_INSTALL_MANIFESTS names, so the installation carries no test
  # source.
  #
  # It ends with TestContract through ORIGO_LIVE_URL: from the suite's
  # side an installation with no stub wiring is a live one, and the six
  # groups of spec 021's skip list are exactly the cases that need it.
  install:
    name: install from the documentation
    if: github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate-images
          path: out/images
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          install_only: true
      - name: Create a bare cluster with the candidate images
        run: |
          set -euo pipefail
          . deploy/examples/kind/versions.env
          kind create cluster --name origo --config deploy/examples/kind/kind.yaml
          helm repo add cilium https://helm.cilium.io --force-update
          helm install cilium cilium/cilium --version "$CILIUM_CHART_VERSION" \
            --namespace kube-system --set ipam.mode=kubernetes
          kubectl -n kube-system rollout status daemonset/cilium --timeout=300s
          kind load image-archive --name origo out/images/origod.tar
          kind load image-archive --name origo out/images/origo-stubs.tar
      - name: Walk docs/install.md
        env:
          ORIGO_INSTALL_IMAGE: ghcr.io/latere-ai/origod:candidate
          ORIGO_INSTALL_MANIFESTS: deploy/examples/kind
        run: tools/docs/run-blocks.sh docs/install.md
      - name: What the installation looked like when a block failed
        if: failure()
        run: |
          kubectl -n origo get all -o wide || true
          kubectl -n origo get endpoints || true
          kubectl -n origo logs -l app.kubernetes.io/name=origod --tail=60 --prefix || true
          kubectl -n origo describe pod origod-0 || true
          # The SSH step of the document is the one that reaches a host
          # port with something other than curl, so the account says
          # which hop is missing: the node's published ports, the port
          # from inside the node, and the two spellings of the loopback
          # host the document and up.sh use.
          docker port origo-control-plane || true
          docker exec origo-control-plane timeout 5 bash -c 'head -c 64 </dev/tcp/127.0.0.1/30022' || true
          for host in 127.0.0.1 localhost; do
            getent ahosts "$host" || true
            ssh-keyscan -v -T 5 -p 30022 "$host" 2>&1 | tail -5 || true
          done
      - name: The conformance suite against the installation
        run: |
          set -euo pipefail
          token=$(curl -sf -X POST http://localhost:30081/mint -d '{"sub":"install"}' \
            | sed 's/.*"token":"\([^"]*\)".*/\1/')
          ORIGO_LIVE_URL=http://localhost:30180 ORIGO_LIVE_TOKEN="$token" \
            go test -v -count=1 -timeout 15m -tags=e2e ./test/conformance/... -run 'TestContract'

  # Spec 021's mutation job: one node of its own per dropped capability,
  # against MinIO and no stack. The five capabilities are the set
  # ORIGO_TEST_DROP_CAPABILITY takes its value from (internal/config),
  # and TestMutation passes only when the suite fails on that
  # capability's subtests alone.
  mutation:
    name: mutation
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUTATION_CAPABILITIES: "filter allow-tip-sha1-in-want allow-reachable-sha1-in-want atomic push-options"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start MinIO with the bucket
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin "$MINIO_IMAGE" server /data
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint /bin/sh "$MC_IMAGE" -c 'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing local/origo-test'
      - name: Run the mutation test once per capability
        env:
          ORIGO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          ORIGO_TEST_S3_REGION: us-east-1
          ORIGO_TEST_S3_BUCKET: origo-test
          ORIGO_TEST_S3_KEY: minioadmin
          ORIGO_TEST_S3_SECRET: minioadmin
          ORIGO_TEST_S3_PATH_STYLE: "1"
        run: |
          for capability in $MUTATION_CAPABILITIES; do
            ORIGO_TEST_DROP_CAPABILITY="$capability" go test -count=1 -timeout 15m -tags=e2e ./test/e2e/... -run 'TestMutation'
          done

  # Every fuzz function of the module for 40 seconds, weekly, and on a
  # manual dispatch. A job that can only be started by waiting a week is a
  # job nobody can verify when they need it: spec 009 waited on the Sunday
  # run for a criterion a dispatch answers in an hour. The cron is named,
  # not just the event: two schedules reach this workflow since 1c63439,
  # and `github.event_name == 'schedule'` alone ran the whole sweep a
  # second time every Monday, on the trigger the slow cluster tier was
  # given.
  fuzz:
    name: fuzz
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fuzz
      # The other half of the marker sweep the `live` job of release.yml
      # runs. Two specs name this job as what holds them at `testing`, and
      # a green run that nobody reads back into them is how the deck fell
      # behind before. Warns, never fails.
      - name: Name the specs this run unblocks
        if: ${{ success() }}
        run: |
          set -euo pipefail
          waiting=$(tools/release/waiting.sh specs 'the weekly fuzz job of verify.yml')
          if [ -z "$waiting" ]; then
            echo "no spec at testing waits on the fuzz job"
            exit 0
          fi
          {
            echo "## Specs this fuzz run unblocks"
            echo
            echo "The 40 second search passed. Each spec below is still at"
            echo "\`testing\` and names this job as what it waits on."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for spec in $waiting; do
            echo "::warning title=Spec waiting on the fuzz job::$spec is at testing and waits on this job, which has now passed"
            echo "- \`specs/$spec\`" >> "$GITHUB_STEP_SUMMARY"
          done
