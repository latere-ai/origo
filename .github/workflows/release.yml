# A vX.Y.Z tag is a release. The build, the signatures and the publish
# run through latere-ai/ci's shared image release stages; the steps only
# Origo has run as its own jobs between and after them, and read the
# images the build stage pushed from its outputs. Nothing has a tag until
# the publish stage, so every job before it names an image by digest.
#
#   build           image-build.yml: the tag's commit passed verify and is
#                   on main, and the tag has a CHANGELOG section; the eight
#                   binary archives, origod and origo for the four
#                   platforms; the two multi-arch images, each pushed by
#                   digest under no tag, signed, and given a bill of
#                   materials and, while the repository is public, SBOM
#                   and provenance attestations; then the deploy archive
#   conformance     the kind stack of spec 013 from the pushed digests:
#                   the release fixture, spec 021's TestContract, and the
#                   fixture the previous release attached
#   deploy          only with the repository variable ORIGO_RELEASE_DEPLOY:
#                   deploy/prod applied at the origod digest, the rollout
#                   waited for, the smoke
#   live            spec 021's run against ORIGO_LIVE_URL
#   publish         image-publish.yml: the digests tagged, checksums.txt
#                   over every file the release attaches, the fixture
#                   included, signed, and the GitHub release with the
#                   evidence of the jobs above
#   install-release docs/install.md walked against the published images
#                   and the published deploy archive, on a bare cluster
#   release-verify  release-verify.yml: a clean runner verifying what was
#                   published
#
# The image namespace is the repository owner's, lowered, so a fork's tag
# publishes under the fork's; the repository variable
# RELEASE_IMAGE_NAMESPACE overrides it. Each job is granted only what it
# needs.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Step 1. Everything that is built from the tag's tree, signed, and
  # attested. Nothing here reaches a cluster.
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@v1
    # The stage reads the tagged commit's verify runs, pushes the images,
    # signs them with the job's OIDC token and attests them; a calling job
    # that grants less fails before it starts.
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      # origod answers -version with "origod <tag> (<commit>, <date>)".
      # Dockerfile.ci copies the binary the archives command compiles, so
      # the image and the archive of one release hold one binary. Its
      # runtime stage installs packages for the target platform, so the
      # linux/arm64 half runs under the emulation the stage sets up.
      image_1: '{"name": "origod", "dockerfile": "Dockerfile.ci", "version_args": "-version", "version_expect": "{name} {tag} ("}'
      # The test stubs of spec 013, which the conformance stack and an
      # operator's first installation run. The stub binary prints no
      # version, so there is nothing to check it against.
      image_2: '{"name": "origo-stubs", "dockerfile": "Dockerfile.stubs"}'
      # Every archive RELEASE_BINARIES names for every platform of
      # RELEASE_PLATFORMS: origod and origo, the agent client of spec 025,
      # for the four os/arch pairs, with the -ldflags of spec 002, so a
      # binary from the pipeline and one from `make build` carry their
      # identity the same way. The binaries stay under
      # out/release/bin/<os>_<arch>/, which Dockerfile.ci copies its
      # platform's from; only the archives go to dist/, because the publish
      # stage attaches every file there and sums them itself.
      archives_command: |
        make release-archives VERSION="$TAG" COMMIT="$(git rev-parse --short HEAD)"
        cp out/release/*.tar.gz dist/
      # The deploy archive names both images under the namespace they were
      # pushed to, cut from origod's <ref>@<digest>, and links its page to
      # the repository that runs the workflow, so a fork's archive names
      # the fork's packages and pages.
      after_images_command: |
        ORIGO_IMAGE_NAMESPACE="${IMAGE_1%/*}" ORIGO_REPOSITORY="$GITHUB_REPOSITORY" \
          tools/release/deploy-archive.sh "$TAG" "dist/deploy-${TAG}.tar.gz"
      runs_on: ubuntu-latest

  # Step 2. The kind stack of spec 013 from the pushed images. The
  # fixture repository is pushed first, under a slug outside the
  # conformance- prefix so TestContract's cleanup never meets it; then
  # the suite and the previous release's fixture; then the fixture's
  # objects are read from the stack's MinIO and packed. A failure here
  # stops the release.
  conformance:
    name: conformance against the pushed images
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The digests are pulled from the registry, and a package a fork's
    # first release creates is private.
    permissions:
      contents: read
      packages: read
    env:
      ORIGOD_IMAGE: ${{ needs.build.outputs.ref_1 }}
      ORIGOD_DIGEST: ${{ needs.build.outputs.digest_1 }}
      STUBS_IMAGE: ${{ needs.build.outputs.ref_2 }}
      STUBS_DIGEST: ${{ needs.build.outputs.digest_2 }}
      ORIGO_TEST_URL: http://localhost:30180
      ORIGO_TEST_S3_ENDPOINT: http://localhost:30900
      ORIGO_TEST_S3_REGION: us-east-1
      ORIGO_TEST_S3_BUCKET: origo-test
      ORIGO_TEST_S3_KEY: minioadmin
      ORIGO_TEST_S3_SECRET: minioadmin
      ORIGO_TEST_S3_PATH_STYLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The candidate images of spec 013, in the shape the `build` job of
      # verify.yml saves them, so up.sh loads them the way the e2e job
      # does: the kind overlay names each image by its :candidate tag. The
      # bytes are the pushed digests, so the stack runs the image the
      # release publishes and not a second build of it.
      - name: Pull the pushed linux/amd64 images for the stack
        run: |
          set -euo pipefail
          mkdir -p out/images
          docker pull "${ORIGOD_IMAGE}@${ORIGOD_DIGEST}"
          docker pull "${STUBS_IMAGE}@${STUBS_DIGEST}"
          docker tag "${ORIGOD_IMAGE}@${ORIGOD_DIGEST}" "${ORIGOD_IMAGE}:candidate"
          docker tag "${STUBS_IMAGE}@${STUBS_DIGEST}" "${STUBS_IMAGE}:candidate"
          docker save -o out/images/origod.tar "${ORIGOD_IMAGE}:candidate"
          docker save -o out/images/origo-stubs.tar "${STUBS_IMAGE}:candidate"

      # Spec 017's image criterion, on the pushed bytes rather than a
      # local build: git inside the image is at or above the 2.40 floor
      # `origod check` enforces (spec 018).
      - name: Check git inside the pushed image
        run: |
          set -euo pipefail
          got=$(docker run --rm --entrypoint git "${ORIGOD_IMAGE}:candidate" --version | awk '{print $3}')
          echo "git $got"
          [ "$(printf '%s\n2.40\n' "$got" | sort -V | head -1)" = "2.40" ] || { echo "::error::git $got is below 2.40"; exit 1; }

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - name: Bring the stack up
        run: deploy/examples/kind/up.sh out/images/origod.tar out/images/origo-stubs.tar

      - name: Push the release fixture
        run: go test -v -count=1 -timeout 10m -tags=e2e ./test/conformance/... -run 'TestReleaseFixturePush' -fixture "$RUNNER_TEMP/fixture"

      # The fixture the latest release attached, when there is one. The
      # tag being released has no release yet, so this finds the previous
      # one; a fork with no release and a first tag find nothing and
      # TestPreviousReleaseFixture skips.
      - name: Download the previous release's fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'fixture-*.tar.gz' --dir "$RUNNER_TEMP/previous"; then
            fixture=$(ls "$RUNNER_TEMP/previous"/fixture-*.tar.gz | head -1)
            echo "ORIGO_PREVIOUS_RELEASE_FIXTURE=$fixture" >> "$GITHUB_ENV"
            echo "previous release fixture: $fixture"
          else
            echo "no release carries a fixture; TestPreviousReleaseFixture skips"
          fi

      - name: Run the conformance suite and the compatibility test
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          go test -v -count=1 -timeout 30m -tags=e2e ./test/conformance/... \
            -run 'TestContract|TestSameAnswersOnStubAndStack|TestPreviousReleaseFixture' 2>&1 | tee conformance.log
          {
            echo "## Conformance"
            echo
            echo '```'
            grep -E '^(=== RUN|--- (PASS|FAIL|SKIP)|ok|FAIL)' conformance.log | tail -60
            echo '```'
          } > release-evidence/conformance.md

      # The server's view, only when a step above failed: the client sees
      # a reset, and what reset it is in the pods' logs. Every pod's every
      # container, the current run and the one before a restart, so a
      # panic the http server recovered and a crash that took the pod are
      # both here; then describe and the namespace's events.
      - name: Dump the stack on failure
        if: failure()
        run: |
          set +e
          echo "===== pods ====="
          kubectl get pods -n origo -o wide
          echo "===== events ====="
          kubectl get events -n origo --sort-by=.lastTimestamp | tail -80
          for p in $(kubectl get pods -n origo -o name); do
            echo "===== $p (current) ====="
            kubectl logs "$p" -n origo --all-containers --prefix --tail=-1
            echo "===== $p (previous, if it restarted) ====="
            kubectl logs "$p" -n origo --all-containers --prefix --previous --tail=-1 2>/dev/null || echo "(no previous container)"
          done
          echo "===== describe origod ====="
          kubectl describe pods -n origo -l app.kubernetes.io/name=origod

      - name: Pack the fixture for the next release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go test -v -count=1 -timeout 10m -tags=e2e ./test/conformance/... -run 'TestReleaseFixturePack' -fixture "$RUNNER_TEMP/fixture"
          mkdir -p out/fixture
          cp "$RUNNER_TEMP/fixture/fixture.tar.gz" "out/fixture/fixture-${TAG}.tar.gz"

      # The publish stage attaches this artifact beside the build's files
      # and sums it with them, so the next release finds the fixture and
      # checksums.txt covers it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-fixture
          path: out/fixture/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-evidence
          path: release-evidence/conformance.md
          if-no-files-found: error

  # Step 3. Latere's own installation. The repository variable and the
  # kubeconfig secret are set on this repository and on no fork, so a
  # tag on a fork publishes every artifact and skips this step.
  deploy:
    name: deploy and smoke
    needs: [build, conformance]
    if: ${{ vars.ORIGO_RELEASE_DEPLOY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://code.latere.ai
    outputs:
      evidence: ${{ steps.smoke.outputs.evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.ORIGO_KUBECONFIG }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      # deploy/prod holds only re-appliable manifests; deploy/bootstrap
      # is never read here.
      - name: Apply deploy/prod and roll the new image
        env:
          ORIGOD_IMAGE: ${{ needs.build.outputs.ref_1 }}
          ORIGOD_DIGEST: ${{ needs.build.outputs.digest_1 }}
        run: |
          set -euo pipefail
          # The namespace is the overlay's, not a name repeated here: an
          # installation chooses where it runs, and this job deploys
          # whatever deploy/prod declares.
          NS=$(kubectl kustomize deploy/prod | awk '/^  namespace: /{print $2; exit}')
          test -n "$NS"
          # deploy/prod is Latere's overlay and its images field selects
          # the base by the namespace the tree carries. A repository
          # publishing elsewhere applies the same manifests against its
          # own packages, so the name moves with the images before the
          # apply rather than only on the set image below.
          if [ "$ORIGOD_IMAGE" != "ghcr.io/latere-ai/origod" ]; then
            sed -i "s|ghcr.io/latere-ai/origod|${ORIGOD_IMAGE}|g" deploy/prod/kustomization.yaml deploy/base/deployment.yaml
          fi
          # The overlay pins the release's tag, which the publish stage
          # gives the digest only after this job. The pin moves to the
          # digest before the apply, so no ReplicaSet names a tag that
          # does not resolve yet. The overlay has one images entry; a
          # second would take origod's digest here, so it is refused.
          test "$(grep -c '^    newTag: ' deploy/prod/kustomization.yaml)" = 1
          sed -i "s|^    newTag: .*|    digest: ${ORIGOD_DIGEST}|" deploy/prod/kustomization.yaml
          kubectl apply -k deploy/prod/
          # Every container of the workload, which is the node and the
          # check that runs in front of it; both are this one image.
          kubectl -n "$NS" set image deployment/origod "*=${ORIGOD_IMAGE}@${ORIGOD_DIGEST}"
          kubectl -n "$NS" rollout status deployment/origod --timeout=600s
      - name: Smoke the live service
        id: smoke
        env:
          BASE_URL: https://code.latere.ai
          # code.latere.ai is shared with the browsing interface
          # (latere-ai/origo-web), which serves / in place of the landing
          # page of spec 022. Everything the smoke reaches under a path is
          # still Origo's.
          LANDING: "0"
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DEPLOY_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          OUTPUT_MD=release-evidence/smoke.md tools/smoke/release.sh
          cat release-evidence/smoke.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'evidence<<CI_EOF'
            cat release-evidence/smoke.md
            echo CI_EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-evidence
          path: release-evidence/smoke.md
          if-no-files-found: error

  # Step 4. The live run of spec 021: TestContract against the
  # installation ORIGO_LIVE_URL names, with that spec's six-entry skip
  # list. The test skips when the URL is unset, so a fork runs no live
  # run and a repository that deploys nothing reaches this job with
  # deploy skipped.
  live:
    name: conformance against the live installation
    needs: [conformance, deploy]
    if: ${{ always() && needs.conformance.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A token good at Origo is short lived by design, so a stored one
      # would be expired before any release used it. When the
      # installation's issuer and a client credential are configured the
      # job mints its own; an operator who has a long-lived token instead
      # sets ORIGO_LIVE_TOKEN and this step does nothing.
      # The `secrets` context is not available to a step's `if`, so the
      # step always runs and decides from its own environment.
      - name: Mint a token for the live run
        env:
          TOKEN_URL: ${{ vars.ORIGO_LIVE_TOKEN_URL }}
          CLIENT_ID: ${{ vars.ORIGO_LIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ORIGO_LIVE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_SECRET" ]; then
            echo "no client credential configured; the run uses ORIGO_LIVE_TOKEN if it is set"
            exit 0
          fi
          test -n "$TOKEN_URL" && test -n "$CLIENT_ID"
          tok=$(curl -sS --fail-with-body -X POST "$TOKEN_URL" \
            -d grant_type=client_credentials \
            -d "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            -d audience=origo | jq -re .access_token)
          echo "::add-mask::$tok"
          echo "ORIGO_LIVE_TOKEN=$tok" >> "$GITHUB_ENV"
      - name: Run the conformance suite against ORIGO_LIVE_URL
        env:
          ORIGO_LIVE_URL: ${{ secrets.ORIGO_LIVE_URL }}
          ORIGO_LIVE_TOKEN: ${{ env.ORIGO_LIVE_TOKEN || secrets.ORIGO_LIVE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          go test -v -count=1 -timeout 25m -tags=e2e ./test/conformance/... -run 'TestContract' 2>&1 | tee live.log
          {
            echo "## Live conformance"
            echo
            echo '```'
            grep -E '^(--- (PASS|FAIL|SKIP)|ok|FAIL)' live.log | tail -40
            echo '```'
          } > release-evidence/live.md
      # The live run is the one thing four specs named as what held them
      # at `testing`, and after v0.1.3 produced it they sat unrecorded
      # for a day because nothing connected the run to them. This step
      # is that connection: it names every spec still at `testing` whose
      # Outcome says it waits on this job. It warns and never fails, so
      # a document being behind does not turn a release red.
      - name: Name the specs this run unblocks
        if: ${{ success() }}
        run: |
          set -euo pipefail
          waiting=$(tools/release/waiting.sh specs 'the live job of release.yml')
          if [ -z "$waiting" ]; then
            echo "no spec at testing waits on the live job"
            exit 0
          fi
          {
            echo "## Specs this live run unblocks"
            echo
            echo "The run passed. Each spec below is still at \`testing\` and"
            echo "names this job as what it waits on; read it and close it."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for spec in $waiting; do
            echo "::warning title=Spec waiting on the live run::$spec is at testing and waits on this job, which has now passed"
            echo "- \`specs/$spec\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-evidence
          path: release-evidence/live.md
          if-no-files-found: error

  # Step 5. The digests get the release tag, checksums.txt is written
  # over every file the release attaches, the build's archives, bills of
  # materials and deploy archive and conformance's fixture, and signed,
  # and the GitHub release is published: the CHANGELOG.md section as the
  # body, then the evidence of the jobs that ran.
  publish:
    needs: [build, conformance, deploy, live]
    if: ${{ always() && needs.build.result == 'success' && needs.conformance.result == 'success' && needs.deploy.result != 'failure' && needs.live.result == 'success' }}
    uses: latere-ai/ci/.github/workflows/image-publish.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      title: Origo
      artifacts: release-fixture
      evidence: '*-evidence'
      runs_on: ubuntu-latest

  # Step 6. The installation document walked against the release that
  # was just published, with nothing from this pipeline's own build: the
  # images are pulled from the registry and the manifests come out of
  # deploy-<version>.tar.gz downloaded from the release. A push proves
  # the commands against a candidate build; this proves them against
  # what an operator downloads, which is the claim the release notes
  # make. It runs after publish because the archive it reads is a
  # release asset.
  install-release:
    name: install from the release artifacts
    needs: [build, publish]
    # publish runs under always(), so its own gate is explicit here too: a
    # job that leans on the implicit success() is skipped whenever any job
    # above it in the graph is, and deploy is skipped on every repository
    # that sets no ORIGO_RELEASE_DEPLOY.
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pulling the published images needs a token that can read the
    # registry, since a fork's packages start private.
    permissions:
      contents: read
      packages: read
    env:
      ORIGOD_IMAGE: ${{ needs.build.outputs.ref_1 }}
      STUBS_IMAGE: ${{ needs.build.outputs.ref_2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # release-verify checks every attached file against checksums.txt;
      # what it cannot know is which files an Origo release must attach
      # and what the deploy archive must hold. An operator verifies the
      # deploy archive before applying it (docs/upgrades/README.md), so
      # the sums name it and the fixture, and the archive carries the
      # base, the page that describes it, and origod at this release.
      - name: Download and check the release's deploy archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --pattern "deploy-${TAG}.tar.gz" --pattern "fixture-${TAG}.tar.gz" \
            --pattern checksums.txt --dir "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          grep -q " deploy-${TAG}.tar.gz$" checksums.txt
          grep -q " fixture-${TAG}.tar.gz$" checksums.txt
          test -s "fixture-${TAG}.tar.gz"
          tar -xzf "deploy-${TAG}.tar.gz"
          test -f deploy/examples/kind/kustomization.yaml
          test -f deploy/base/deployment.yaml
          # The installation page ships with the manifests it describes, so a
          # reader of this release follows the prose of this release.
          test -f install.md
          grep -q "image: ${ORIGOD_IMAGE}:${TAG}" deploy/base/deployment.yaml
      - name: Create a bare cluster with the published images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . deploy/examples/kind/versions.env
          kind create cluster --name origo --config deploy/examples/kind/kind.yaml
          helm repo add cilium https://helm.cilium.io --force-update
          helm install cilium cilium/cilium --version "$CILIUM_CHART_VERSION" \
            --namespace kube-system --set ipam.mode=kubernetes
          kubectl -n kube-system rollout status daemonset/cilium --timeout=300s
          for image in "${ORIGOD_IMAGE}:${TAG}" "${STUBS_IMAGE}:${TAG}"; do
            docker pull "$image"
            kind load docker-image --name origo "$image"
          done
      - name: Walk docs/install.md against the release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ORIGO_INSTALL_IMAGE="${ORIGOD_IMAGE}:${TAG}" \
          ORIGO_INSTALL_MANIFESTS="$RUNNER_TEMP/release/deploy/examples/kind" \
            tools/docs/run-blocks.sh docs/install.md
      - name: The conformance suite against the installation
        run: |
          set -euo pipefail
          token=$(curl -sf -X POST http://localhost:30081/mint -d '{"sub":"install-release"}' \
            | sed 's/.*"token":"\([^"]*\)".*/\1/')
          ORIGO_LIVE_URL=http://localhost:30180 ORIGO_LIVE_TOKEN="$token" \
            go test -v -count=1 -timeout 15m -tags=e2e ./test/conformance/... -run 'TestContract'

  # Step 7. What was published, checked from a clean runner with no
  # checkout, the way docs/upgrades/README.md tells an operator to: the
  # signature over checksums.txt, and the same check for another
  # repository refused; every asset against checksums.txt; each image's
  # tag resolving to a digest signed, and attested, by the build stage run
  # for this repository; and the release body against the changelog
  # section.
  release-verify:
    needs: publish
    # Explicit for the same reason as install-release above.
    if: ${{ always() && needs.publish.result == 'success' }}
    uses: latere-ai/ci/.github/workflows/release-verify.yml@v1
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: |
        origod
        origo-stubs
      runs_on: ubuntu-latest
