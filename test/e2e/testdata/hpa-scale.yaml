# Applied with cluster.ApplyManifest by spec 005's
# TestSlowAutoscalerScalesUp: the autoscaler named origod free to scale
# between 3 and 8 replicas on CPU, replacing the overlay's, which is
# held at 3 so the other tests see three pods. The scale-up window is 0
# so the crossing is answered within one reconcile; the scale-down
# window is the overlay's 60 seconds. cluster.Apply of the overlay
# restores the held autoscaler.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: origod
  namespace: origo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: origod
  minReplicas: 3
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
