# Applied with cluster.ApplyManifest: the nodes lose egress to MinIO and
# keep everything else (the stubs, DNS, each other), so a request that
# needs the bucket fails and one that does not keeps working. Every
# other pod in every namespace stays reachable; the one exception is the
# pod labelled minio. Enforced by Cilium (spec 013's overlay table).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cut-storage
  namespace: origo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: origod
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: NotIn
                values: [minio]
